name: shlabs-db

services:
  mysql:
    image: mysql:8.4
    container_name: shlabs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: shlabs_root_pass
      MYSQL_DATABASE: shlabs_ecom
      MYSQL_USER: shlabs
      MYSQL_PASSWORD: shlabs_pass
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - shlabs_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ushlabs", "-pshlabs_pass"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - shlabs-net

  postgres:
    image: postgres:16-alpine
    container_name: shlabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shlabs
      POSTGRES_PASSWORD: shlabs_pass
      POSTGRES_DB: shlabs_hr
      TZ: Asia/Shanghai
    volumes:
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
      - shlabs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlabs -d shlabs_hr"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - shlabs-net

  sqlite:
    image: keinos/sqlite3:latest
    container_name: shlabs-sqlite
    restart: unless-stopped
    # 镜像默认以非 root 的 sqlite 用户运行，named volume 首挂属主是 root，
    # 非写权限 → 初始化失败；显式以 root 运行完成初始化
    user: root
    # SQLite 是文件数据库：初始化脚本生成 /data/shlabs_notes.db 后常驻，
    # 消费方（webshell 宿主容器）经共享 volume / docker cp 读取该文件
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if [ ! -s /data/shlabs_notes.db ]; then
         sqlite3 /data/shlabs_notes.db < /init/schema.sql;
         echo 'shlabs: shlabs_notes.db initialized';
       fi;
       exec sleep infinity"
    volumes:
      - ./sqlite/init:/init:ro
      - shlabs_sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/shlabs_notes.db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shlabs-net

# 不发布任何宿主机端口：数据库只在 shlabs-net 内部可达（容器名直连）。
# 靶场接入：base/*/docker-compose.yml 声明外部网络 shlabs-net，或运行时
#   docker network connect shlabs-net <靶场容器名>
networks:
  shlabs-net:
    name: shlabs-net

volumes:
  shlabs_mysql_data:
  shlabs_pg_data:
  shlabs_sqlite_data:
